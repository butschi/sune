server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Health endpoint for ONCE / kamal-proxy: must return 200, no auth, no dependencies
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # The HTML shell and service worker must always revalidate so deploys land immediately
    location ~ ^/(index\.html|sw\.js)?$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # Static assets: cache moderately; the service worker handles offline anyway
    location ~ \.(js|css|png|woff2|json)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
